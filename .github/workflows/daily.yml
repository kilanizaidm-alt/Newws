          files = json.loads(gzip.decompress(base64.b64decode(payload)))
          allowed = {'tests/test_updater.py', 'scripts/chunked_lesson.py', 'web/data/glossary-bank.json', 'scripts/update_news.py', 'scripts/refresh_classroom.py', 'tests/test_fallback.py', 'web/fallback.js', 'scripts/openrouter_transport.py'}
          assert set(files) == allowed
          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          index = Path('web/index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="fallback.js" defer></script>'
          if tag not in html:
              assert '<script src="app.js" defer></script>' in html
              html = html.replace('<script src="app.js" defer></script>', '<script src="app.js" defer></script>\n  ' + tag)
              index.write_text(html, encoding='utf-8')
          PYTHON
      - name: Check lesson updater and fallback
        run: python3 -m unittest discover -s tests -v
      - name: Refresh publisher reports and optional translation
        id: refresh
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_TIER_CONFIRMED: ${{ vars.FREE_TIER_CONFIRMED }}
        run: python3 scripts/refresh_classroom.py
      - name: Save classroom files and lessons
        run: |
          git config user.name 'Classroom publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web scripts tests START-HERE.md .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'Update classroom reports and glossary'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
          retention-days: 1
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report publisher feed failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Publisher refresh failed. The last available content was retained.'
          exit 1

