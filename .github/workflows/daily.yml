name: Daily classroom edition

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: classroom-publication
  cancel-in-progress: false

