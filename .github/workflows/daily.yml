      - name: Check lesson updater and fallback
        run: python3 -m unittest discover -s tests -v
      - name: Refresh publisher reports and optional translation
        id: refresh
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_TIER_CONFIRMED: ${{ vars.FREE_TIER_CONFIRMED }}
        run: python3 scripts/refresh_classroom.py
      - name: Save classroom files and lessons
        run: |
          git config user.name 'Classroom publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web scripts tests START-HERE.md .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'Update classroom reports and glossary'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
          retention-days: 1
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report publisher feed failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Publisher refresh failed. The last available content was retained.'
          exit 1

